name: Optik Fotoğraf Regresyon Testleri
on:
  pull_request:
    paths:
      - 'app/lib/optical*.js'
      - 'tests/optical-photo-synthetic.test.mjs'
      - 'package.json'
      - '.github/workflows/optical-photo-tests.yml'
  push:
    branches: [main]
    paths:
      - 'app/lib/optical*.js'
      - 'tests/optical-photo-synthetic.test.mjs'
      - 'package.json'
      - '.github/workflows/optical-photo-tests.yml'
jobs:
  optical-synthetic-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Optik sentetik A4 görüntü testlerini çalıştır
        run: npm run test:optical
